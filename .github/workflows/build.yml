name: Build FongMi APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建版本'
        required: true
        default: 'leanback'
        type: choice
        options:
          - leanback    # 电视 / 投影仪
          - mobile      # 手机 / 平板

  push:
    paths:
      - 'assets/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---- 1. 检出我们的仓库（assets/ 目录）----
      - name: Checkout jmgo-n3-channels
        uses: actions/checkout@v4
        with:
          path: jmgo-n3-channels
          sparse-checkout: |
            assets
            README.md

      # ---- 2. 下载 FongMi 预编译 APK ----
      - name: 下载 FongMi 预编译 APK
        run: |
          set -e
          FLAVOR="${{ inputs.flavor || 'leanback' }}"
          ARCH="arm64_v8a"
          APK_URL="https://raw.githubusercontent.com/FongMi/Release/fongmi/apk/${FLAVOR}-${ARCH}.apk"
          echo "下载: $APK_URL"
          curl -fsSL -o base.apk "$APK_URL"
          ls -lh base.apk
          echo "APK_SIZE=$(stat -c%s base.apk)" >> $GITHUB_ENV

      # ---- 3. 准备 JDK 17（用于 apksigner）----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- 4. 安装 Android SDK build-tools（提供 apksigner + zipalign）----
      - name: Install Android SDK tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          rm cmd.zip
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      # ---- 5. 注入我们的频道文件到 APK ----
      - name: 注入频道源到 APK
        run: |
          set -e
          # APK 本质就是 zip，可以直接添加文件
          SRC_DIR="$GITHUB_WORKSPACE/jmgo-n3-channels/assets"
          
          # 先查看 APK 中已有的 assets 结构
          echo "=== APK 已有 assets ==="
          unzip -l base.apk | grep -E "^.*assets/" | head -20 || echo "(无 assets 目录)"
          
          # 直接用 zip 命令添加我们的文件到 APK
          # 注意：APK 中的 assets 目录是 assets/
          cd "$SRC_DIR"
          zip -r "$GITHUB_WORKSPACE/base.apk" spider/ config/ \
            --quiet
          
          echo "=== 注入后 APK 中的 spider 文件 ==="
          unzip -l "$GITHUB_WORKSPACE/base.apk" | grep -E "spider/.*\.py" | head -10
          echo "..."
          SPIDER_COUNT=$(unzip -l "$GITHUB_WORKSPACE/base.apk" | grep -cE "spider/.*\.py" || true)
          echo "总 .py 文件数: $SPIDER_COUNT"

      # ---- 6. 生成调试密钥并签名 APK ----
      - name: 生成调试密钥并签名 APK
        run: |
          set -e
          # 生成调试密钥库
          keytool -genkey -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"
          
          # 生成对齐 + 签名的 APK
          FLAVOR="${{ inputs.flavor || 'leanback' }}"
          OUTPUT_APK="app-${FLAVOR}-release.apk"
          
          # zipalign
          zipalign -f -p 4 base.apk aligned.apk
          
          # apksigner
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias debug --key-pass pass:android \
            --out "$OUTPUT_APK" aligned.apk
          
          echo "=== 签名完成 ==="
          ls -lh "$OUTPUT_APK"
          echo "APK_PATH=$GITHUB_WORKSPACE/$OUTPUT_APK" >> $GITHUB_ENV
          echo "APK_NAME=$OUTPUT_APK" >> $GITHUB_ENV

      # ---- 7. 上传最终 APK ----
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.flavor || 'leanback' }}-release
          path: app-${{ inputs.flavor || 'leanback' }}-release.apk
          if-no-files-found: error
          retention-days: 30